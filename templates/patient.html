<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Information | RetinaCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">◉</div>
            <span>RetinaCare</span>
        </div>


        <nav class="sidebar-nav">

            <a href="{{ url_for('patient') }}">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="{{ url_for('patient') }}"
               class="active">
                <span>♙</span>
                Patient Info
            </a>

            <a href="{{ url_for('symptoms') }}">
                <span>◉</span>
                Symptoms
            </a>

            <a href="{{ url_for('upload') }}">
                <span>▣</span>
                Image Upload
            </a>

            <a href="{{ url_for('upload') }}">
                <span>▤</span>
                Results
            </a>

            <a href="#">
                <span>ⓘ</span>
                Disease Info
            </a>

            <a href="{{ url_for('home') }}">
                <span>↪</span>
                Logout
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div class="mobile-menu">☰</div>

            <div class="mini-brand">
                ◉ RetinaCare
            </div>

            <div class="profile-circle">
                ♙
            </div>

        </header>


        <section class="dashboard-content">

            <div class="page-heading">

                <div>
                    <h1>Patient Information</h1>

                    <p>
                        Please fill in the patient details
                    </p>
                </div>

                <div class="profile-large">
                    ♙
                </div>

            </div>


            <form action="{{ url_for('patient') }}"
                  method="POST"
                  class="patient-card">


                <div class="form-grid">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input type="text"
                               name="full_name"
                               value="{{ user.full_name or '' }}"
                               placeholder="Enter full name">

                    </div>


                    <div class="form-group">

                        <label>Age</label>

                        <input type="number"
                               name="age"
                               value="{{ user.age or '' }}"
                               placeholder="Enter age">

                    </div>


                    <div class="form-group">

                        <label>Gender</label>

                        <select name="gender">

                            <option value="">
                                Select gender
                            </option>

                            <option value="Male"
                                {% if user.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if user.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if user.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Contact Number</label>

                        <input type="tel"
                               name="mobile"
                               value="{{ user.mobile or '' }}"
                               placeholder="Enter contact number">

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               value="{{ user.email or '' }}"
                               placeholder="Enter email address">

                    </div>


                    <div class="form-group">

                        <label>Diabetes</label>

                        <select name="diabetes">

                            <option value="">
                                Select option
                            </option>

                            <option value="Yes"
                                {% if user.diabetes == "Yes" %}selected{% endif %}>
                                Yes
                            </option>

                            <option value="No"
                                {% if user.diabetes == "No" %}selected{% endif %}>
                                No
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Diabetes Duration</label>

                        <input type="number"
                               name="diabetes_years"
                               value="{{ user.diabetes_years or '' }}"
                               placeholder="Years">

                    </div>

                </div>


                <div class="form-actions">

                    <button type="submit"
                            class="primary-button">
                        Save & Continue
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
