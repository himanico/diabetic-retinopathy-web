<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | RetinaCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-left">

        <div class="brand auth-brand">
            <div class="brand-icon">◉</div>
            <span>RetinaCare</span>
        </div>

        <div class="auth-form-area">

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Login to your account
            </p>

            <form action="{{ url_for('login') }}"
                  method="POST"
                  class="auth-form">

                <label for="username">
                    Email / Username
                </label>

                <div class="input-box">
                    <span>♙</span>

                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Enter username"
                           required>
                </div>


                <label for="password">
                    Password
                </label>

                <div class="input-box">
                    <span>🔒</span>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           required>

                    <span>◉</span>
                </div>


                <div class="remember-row">

                    <label class="check-label">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit"
                        class="primary-button full-button">
                    Login
                </button>

            </form>


            <div class="or-line">
                <span>or continue with</span>
            </div>


            <div class="social-buttons">

                <button type="button">
                    <b>G</b> Google
                </button>

                <button type="button">
                    <b>▦</b> Microsoft
                </button>

            </div>


            <p class="bottom-text">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Sign up
                </a>
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="auth-right login-art">

        <div class="shield">
            🔒
        </div>

        <div class="login-retina-image">

            <img src="{{ url_for('static', filename='image.jpeg') }}"
                 alt="Retinal Image">

        </div>

        <div class="art-leaf leaf-one"></div>
        <div class="art-leaf leaf-two"></div>
        <div class="art-leaf leaf-three"></div>

    </div>

</div>

</body>
</html>
